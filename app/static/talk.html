<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Talk to Maya</title>
<style>
  :root {
    color-scheme: light dark;
    --bg: #f5f6f8;
    --card: #ffffff;
    --text: #1b1e24;
    --muted: #646b78;
    --border: #dde1e7;
    --accent: #2f6fed;
    --accent-text: #ffffff;
    --danger: #d23b3b;
    --bot-bubble: #eef1f6;
    --caller-bubble: #2f6fed;
    --caller-text: #ffffff;
    --meter-bg: #e4e7ec;
    --meter: #2bb673;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #121418;
      --card: #1b1e24;
      --text: #e8eaee;
      --muted: #9aa1ad;
      --border: #2c3038;
      --accent: #5b8ef5;
      --accent-text: #0d1117;
      --danger: #f06464;
      --bot-bubble: #262a32;
      --caller-bubble: #3a62c4;
      --caller-text: #ffffff;
      --meter-bg: #2c3038;
      --meter: #3fcf87;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font: 16px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }
  main {
    max-width: 640px;
    margin: 0 auto;
    padding: 24px 16px;
    display: flex;
    flex-direction: column;
    gap: 16px;
    min-height: 100vh;
  }
  header h1 { margin: 0; font-size: 1.5rem; }
  header p { margin: 4px 0 0; color: var(--muted); font-size: .95rem; }
  .card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 16px;
  }
  .controls { display: flex; flex-wrap: wrap; gap: 12px; align-items: flex-end; }
  .controls label { flex: 1 1 220px; display: flex; flex-direction: column; gap: 6px; font-size: .9rem; color: var(--muted); }
  select, button { font: inherit; border-radius: 8px; }
  select {
    padding: 10px; color: var(--text); background: var(--bg); border: 1px solid var(--border);
  }
  button {
    flex: 0 0 auto; padding: 10px 20px; border: 0; cursor: pointer; font-weight: 600;
    background: var(--accent); color: var(--accent-text); min-width: 120px;
  }
  button.end { background: var(--danger); color: #fff; }
  button:disabled { opacity: .6; cursor: default; }
  .statusrow { display: flex; align-items: center; gap: 12px; margin-top: 14px; }
  #status { flex: 1; font-weight: 600; }
  .meter { width: 120px; height: 8px; border-radius: 4px; background: var(--meter-bg); overflow: hidden; }
  .meter > div { height: 100%; width: 0; background: var(--meter); transition: width 60ms linear; }
  .hint { margin: 10px 0 0; color: var(--muted); font-size: .85rem; }
  #transcript {
    flex: 1; min-height: 240px; overflow-y: auto; display: flex; flex-direction: column; gap: 10px;
  }
  #transcript .empty { color: var(--muted); text-align: center; margin: auto; }
  .msg { max-width: 85%; display: flex; flex-direction: column; gap: 2px; }
  .msg .who { font-size: .75rem; color: var(--muted); }
  .msg .bubble { padding: 8px 12px; border-radius: 14px; white-space: pre-wrap; overflow-wrap: anywhere; }
  .msg.bot { align-self: flex-start; }
  .msg.bot .bubble { background: var(--bot-bubble); border-bottom-left-radius: 4px; }
  .msg.caller { align-self: flex-end; align-items: flex-end; }
  .msg.caller .bubble { background: var(--caller-bubble); color: var(--caller-text); border-bottom-right-radius: 4px; }
</style>
</head>
<body>
<main>
  <header>
    <h1>Talk to Maya</h1>
    <p>Nimbus Mobile voice assistant: test call from your browser microphone.</p>
  </header>

  <section class="card">
    <div class="controls">
      <label>Call as
        <select id="caller">
          <option value="+15551234567">Priya Sharma (+1 555 123 4567)</option>
          <option value="+15559876543">Marcus Lee (+1 555 987 6543)</option>
          <option value="+15555550123">Elena Garcia (+1 555 555 0123)</option>
          <option value="+15550001111">Unknown number (+1 555 000 1111)</option>
        </select>
      </label>
      <button id="call" type="button">Start call</button>
    </div>
    <div class="statusrow">
      <span id="status" role="status" aria-live="polite">Ready</span>
      <div class="meter" title="Microphone level"><div id="level"></div></div>
    </div>
    <p class="hint">Headphones work best: without them Maya may hear herself and stop talking.</p>
  </section>

  <section class="card" id="transcript" aria-live="polite">
    <div class="empty">The conversation will appear here.</div>
  </section>
</main>

<script>
(function () {
  "use strict";

  var RATE = 8000;           // wire format: PCM16 LE, 8 kHz, mono
  var FRAME_SAMPLES = 160;   // 20 ms

  // Runs in the AudioWorkletGlobalScope (where `sampleRate` is the context rate).
  // Band-limits to 3.5 kHz with a windowed-sinc FIR at the input rate, then resamples to 8 kHz
  // by linear interpolation between filtered samples (accurate since the input is heavily oversampled).
  var WORKLET_SRC = [
    "class Downsampler extends AudioWorkletProcessor {",
    "  constructor() {",
    "    super();",
    "    var fs = sampleRate;",
    "    this.step = fs / " + RATE + ";",
    "    var fc = Math.min(3500, fs * 0.45) / fs;",
    "    var n = Math.max(15, Math.ceil(5.5 * fs / 1000)) | 1;",  // Blackman: ~1 kHz transition
    "    var h = new Float32Array(n), m = (n - 1) / 2, sum = 0;",
    "    for (var k = 0; k < n; k++) {",
    "      var t = k - m;",
    "      var sinc = t === 0 ? 2 * fc : Math.sin(2 * Math.PI * fc * t) / (Math.PI * t);",
    "      var w = 0.42 - 0.5 * Math.cos(2 * Math.PI * k / (n - 1)) + 0.08 * Math.cos(4 * Math.PI * k / (n - 1));",
    "      h[k] = sinc * w; sum += h[k];",
    "    }",
    "    for (k = 0; k < n; k++) h[k] /= sum;",  // unity gain at DC
    "    this.h = h; this.n = n;",
    "    var size = 1; while (size < n + 1024) size <<= 1;",
    "    this.ring = new Float32Array(size); this.mask = size - 1;",
    "    this.w = 0;",        // absolute index of the next input sample to be written
    "    this.pos = 0;",      // absolute (fractional) input index of the next output sample
    "    this.out = new Int16Array(" + FRAME_SAMPLES + "); this.outN = 0;",
    "  }",
    "  filt(i) {",
    "    var h = this.h, r = this.ring, mask = this.mask, acc = 0;",
    "    for (var k = 0; k < this.n; k++) acc += h[k] * r[(i - k) & mask];",
    "    return acc;",
    "  }",
    "  process(inputs) {",
    "    var ch = inputs[0] && inputs[0][0];",
    "    if (!ch) return true;",
    "    for (var j = 0; j < ch.length; j++) { this.ring[this.w & this.mask] = ch[j]; this.w++; }",
    "    while (this.pos + 1 < this.w) {",
    "      var i0 = Math.floor(this.pos), frac = this.pos - i0;",
    "      var y = this.filt(i0) * (1 - frac) + (frac > 0 ? this.filt(i0 + 1) * frac : 0);",
    "      var v = Math.round(y * 32767);",
    "      this.out[this.outN++] = v > 32767 ? 32767 : v < -32768 ? -32768 : v;",
    "      if (this.outN === " + FRAME_SAMPLES + ") {",
    "        var buf = this.out.slice().buffer;",
    "        this.port.postMessage(buf, [buf]);",
    "        this.outN = 0;",
    "      }",
    "      this.pos += this.step;",
    "    }",
    "    if (this.w > 0x40000000) {",  // keep indices well inside int32 range for the & mask
    "      var shift = this.w - (this.w & this.mask) - (this.mask + 1);",  // multiple of ring size
    "      this.w -= shift; this.pos -= shift;",
    "    }",
    "    return true;",
    "  }",
    "}",
    "registerProcessor('downsampler-8k', Downsampler);"
  ].join("\n");

  var $ = function (id) { return document.getElementById(id); };
  var callerSel = $("caller"), callBtn = $("call"), statusEl = $("status"), levelEl = $("level"), log = $("transcript");

  var ctx = null, ws = null, stream = null, micSource = null, worklet = null, sink = null;
  var sources = new Set(), nextStart = 0, pendingMarks = [], ticker = null;
  var inCall = false, ended = false, level = 0, can8k = true;

  function setStatus(text) { statusEl.textContent = text; }

  function addLine(speaker, text) {
    var empty = log.querySelector(".empty");
    if (empty) empty.remove();
    var wrap = document.createElement("div");
    wrap.className = "msg " + (speaker === "caller" ? "caller" : "bot");
    var who = document.createElement("span");
    who.className = "who";
    who.textContent = speaker === "caller" ? "You" : "Maya";
    var bubble = document.createElement("div");
    bubble.className = "bubble";
    bubble.textContent = text;
    wrap.appendChild(who);
    wrap.appendChild(bubble);
    log.appendChild(wrap);
    log.scrollTop = log.scrollHeight;
  }

  function send(obj) {
    if (ws && ws.readyState === WebSocket.OPEN) ws.send(typeof obj === "string" ? obj : JSON.stringify(obj));
  }

  // ---- playback -------------------------------------------------------------------------

  function makeBuffer(dv, n) {
    var buf, data, i;
    if (can8k) {
      try {
        buf = ctx.createBuffer(1, n, RATE);
        data = buf.getChannelData(0);
        for (i = 0; i < n; i++) data[i] = dv.getInt16(i * 2, true) / 32768;
        return buf;
      } catch (e) {
        can8k = false;  // very old Safari: fall back to resampling ourselves
      }
    }
    var ratio = ctx.sampleRate / RATE, m = Math.max(1, Math.round(n * ratio));
    buf = ctx.createBuffer(1, m, ctx.sampleRate);
    data = buf.getChannelData(0);
    for (i = 0; i < m; i++) {
      var p = i / ratio, a = Math.floor(p), b = Math.min(a + 1, n - 1), f = p - a;
      data[i] = (dv.getInt16(a * 2, true) * (1 - f) + dv.getInt16(b * 2, true) * f) / 32768;
    }
    return buf;
  }

  function playChunk(ab) {
    var n = ab.byteLength >> 1;
    if (!ctx || n === 0) return;
    var buf = makeBuffer(new DataView(ab), n);
    var src = ctx.createBufferSource();
    src.buffer = buf;
    src.connect(ctx.destination);
    var now = ctx.currentTime;
    if (nextStart < now + 0.01) nextStart = now + 0.05;  // (re)starting after silence: small lead
    src.start(nextStart);
    nextStart += buf.duration;
    sources.add(src);
    src.onended = function () { sources.delete(src); };
  }

  function onMark(name) {
    if (!ctx || nextStart <= ctx.currentTime) {
      send({ type: "mark", name: name });  // nothing queued: it has all played
    } else {
      pendingMarks.push({ name: name, at: nextStart });
    }
  }

  function clearPlayback() {
    sources.forEach(function (src) {
      src.onended = null;
      try { src.stop(); } catch (e) { /* not started yet / already stopped */ }
      try { src.disconnect(); } catch (e) { /* ignore */ }
    });
    sources.clear();
    nextStart = 0;
    pendingMarks = [];  // dropped, never acked: the server infers what was heard from acked marks
  }

  function tick() {
    if (!ctx) return;
    var now = ctx.currentTime;
    while (pendingMarks.length && now >= pendingMarks[0].at) {
      send({ type: "mark", name: pendingMarks.shift().name });
    }
    if (inCall) setStatus(now < nextStart ? "Maya is speaking" : "Listening");
    level *= 0.85;
    levelEl.style.width = Math.min(100, level * 100).toFixed(0) + "%";
  }

  // ---- microphone -----------------------------------------------------------------------

  function onMicFrame(ab) {
    var pcm = new Int16Array(ab), sum = 0;
    for (var i = 0; i < pcm.length; i++) sum += pcm[i] * pcm[i];
    var rms = Math.sqrt(sum / pcm.length) / 32768;
    var db = 20 * Math.log10(rms + 1e-9);         // -60 dBFS .. 0 dBFS -> 0 .. 1
    level = Math.max(level, Math.min(1, Math.max(0, (db + 60) / 60)));
    if (ws && ws.readyState === WebSocket.OPEN && inCall) ws.send(ab);
  }

  async function startMic() {
    stream = await navigator.mediaDevices.getUserMedia({
      audio: { echoCancellation: true, noiseSuppression: true, autoGainControl: true, channelCount: 1 }
    });
    var url = URL.createObjectURL(new Blob([WORKLET_SRC], { type: "application/javascript" }));
    try {
      await ctx.audioWorklet.addModule(url);
    } finally {
      URL.revokeObjectURL(url);
    }
    micSource = ctx.createMediaStreamSource(stream);
    worklet = new AudioWorkletNode(ctx, "downsampler-8k", {
      numberOfInputs: 1, numberOfOutputs: 1, outputChannelCount: [1], channelCount: 1, channelCountMode: "explicit"
    });
    worklet.port.onmessage = function (e) { onMicFrame(e.data); };
    sink = ctx.createGain();  // keep the worklet pulled by the graph, but silent
    sink.gain.value = 0;
    micSource.connect(worklet);
    worklet.connect(sink);
    sink.connect(ctx.destination);
  }

  function stopMic() {
    if (worklet) { worklet.port.onmessage = null; try { worklet.disconnect(); } catch (e) {} }
    if (micSource) { try { micSource.disconnect(); } catch (e) {} }
    if (sink) { try { sink.disconnect(); } catch (e) {} }
    if (stream) stream.getTracks().forEach(function (t) { t.stop(); });
    worklet = micSource = sink = stream = null;
  }

  // ---- call lifecycle -------------------------------------------------------------------

  async function startCall() {
    if (inCall) return;
    ended = false;
    log.innerHTML = '<div class="empty">The conversation will appear here.</div>';
    callBtn.disabled = true;
    callerSel.disabled = true;
    setStatus("Connecting…");
    try {
      ctx = new (window.AudioContext || window.webkitAudioContext)();
      if (ctx.state === "suspended") await ctx.resume();
      await startMic();
    } catch (e) {
      console.error(e);
      endCall(e && e.name === "NotAllowedError" ? "Microphone access was denied" : "Could not start audio: " + (e && e.message || e));
      return;
    }
    var proto = location.protocol === "https:" ? "wss:" : "ws:";
    ws = new WebSocket(proto + "//" + location.host + "/talk/ws");
    ws.binaryType = "arraybuffer";
    ws.onopen = function () {
      inCall = true;
      send({ type: "start", phone: callerSel.value });
      callBtn.textContent = "End call";
      callBtn.classList.add("end");
      callBtn.disabled = false;
      setStatus("Listening");
    };
    ws.onmessage = function (e) {
      if (typeof e.data !== "string") { playChunk(e.data); return; }
      var msg;
      try { msg = JSON.parse(e.data); } catch (err) { return; }
      if (msg.type === "mark") onMark(msg.name);
      else if (msg.type === "clear") clearPlayback();
      else if (msg.type === "transcript") addLine(msg.speaker, msg.text);
      else if (msg.type === "hangup") endCall("Call ended", true);
    };
    ws.onclose = function (e) {
      if (ended) return;
      endCall(e.code === 1008 ? "Call rejected by the server" : inCall ? "Call ended" : "Could not connect to the server", true);
    };
    ws.onerror = function () { /* onclose follows with the details */ };
    ticker = setInterval(tick, 20);
  }

  // letFinish: the bot hung up, so let any audio it already queued (e.g. "goodbye") play out.
  function endCall(message, letFinish) {
    if (ended) return;
    ended = true;
    inCall = false;
    stopMic();
    if (ws) {
      if (ws.readyState === WebSocket.OPEN) send({ type: "hangup" });
      ws.onclose = ws.onmessage = null;
      try { ws.close(1000); } catch (e) {}
      ws = null;
    }
    pendingMarks = [];
    if (ticker) { clearInterval(ticker); ticker = null; }
    var c = ctx;
    ctx = null;
    if (c) {
      var remaining = letFinish ? Math.max(0, nextStart - c.currentTime) : 0;
      if (!letFinish) clearPlayback();
      setTimeout(function () { c.close().catch(function () {}); }, remaining * 1000 + 100);
    }
    sources = new Set();
    nextStart = 0;
    level = 0;
    levelEl.style.width = "0%";
    setStatus(message);
    callBtn.textContent = "Start call";
    callBtn.classList.remove("end");
    callBtn.disabled = false;
    callerSel.disabled = false;
  }

  callBtn.addEventListener("click", function () {
    if (inCall) endCall("Call ended");
    else if (!ctx) startCall();
  });
  window.addEventListener("pagehide", function () { if (inCall) endCall("Call ended"); });

  if (!window.AudioWorkletNode || !navigator.mediaDevices) {
    setStatus("This browser can't capture audio here (needs a modern browser on localhost or https).");
    callBtn.disabled = true;
  }
})();
</script>
</body>
</html>
