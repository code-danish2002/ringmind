; Rendered at container start from env (LAN_IP, SIP_PASSWORD, SIP_100x_CALLERID_NUM).

[global]
type = global
user_agent = ringmind-asterisk

[transport-udp]
type = transport
protocol = udp
bind = 0.0.0.0:5060
; Phones on the Wi-Fi reach us via the Mac's IP (Docker Desktop forwards 5060 + RTP ports),
; so advertise that address in SIP/SDP instead of the container's internal IP.
external_media_address = ${LAN_IP}
external_signaling_address = ${LAN_IP}
; local_net = peers that can reach the container directly (no rewrite). Default: Docker's own
; container networks only. Do NOT add 192.168.0.0/16: Docker Desktop delivers forwarded phone
; traffic from 192.168.65.x, so that range would make Asterisk advertise its unreachable
; container IP in SDP (= no audio from the phone). Override with env LOCAL_NET (comma list).
${LOCAL_NET_LINES}

; ---- shared templates ----
[endpoint-tpl](!)
type = endpoint
transport = transport-udp
context = softphones
disallow = all
allow = ulaw,alaw
direct_media = no
rtp_symmetric = yes
force_rport = yes
rewrite_contact = yes
dtmf_mode = rfc4733

[auth-tpl](!)
type = auth
auth_type = userpass
password = ${SIP_PASSWORD}

[aor-tpl](!)
type = aor
max_contacts = 2
remove_existing = yes
qualify_frequency = 30

; ---- 1001: known demo customer ----
[1001](endpoint-tpl)
auth = 1001
aors = 1001
callerid = "Priya Sharma" <${SIP_1001_CALLERID_NUM}>

[1001](auth-tpl)
username = 1001

[1001](aor-tpl)

; ---- 1002: unknown caller ----
[1002](endpoint-tpl)
auth = 1002
aors = 1002
callerid = <${SIP_1002_CALLERID_NUM}>

[1002](auth-tpl)
username = 1002

[1002](aor-tpl)
