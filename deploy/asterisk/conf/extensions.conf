; Rendered at container start from env (BOT_HOST, BOT_HTTP_PORT, BOT_AUDIOSOCKET_PORT).
[general]
static = yes
writeprotect = yes

[softphones]
; 100: talk to Maya (RingMind).
; AudioSocket carries no caller ID, so register uuid -> caller number over HTTP first.
exten => 100,1,Answer()
 same => n,Set(BOT_UUID=${FILTER(0-9a-f-,${SHELL(cat /proc/sys/kernel/random/uuid)})})
 same => n,Verbose(1,Bot call ${BOT_UUID} from ${CALLERID(num)})
 same => n,Set(REGISTER_RESULT=${CURL(http://${BOT_HOST}:${BOT_HTTP_PORT}/asterisk/register?uuid=${BOT_UUID}&caller=${URIENCODE(${CALLERID(num)})})})
 same => n,Verbose(1,Bot register result: ${REGISTER_RESULT})
 same => n,AudioSocket(${BOT_UUID},${BOT_HOST}:${BOT_AUDIOSOCKET_PORT})
 same => n,Hangup()

; 200: echo test (checks SIP + RTP between phone and Asterisk, no bot needed).
exten => 200,1,Answer()
 same => n,Echo()
 same => n,Hangup()
